[project]
name = "secrets-rot"
version = "0.1.0"
description = "Secret rotation orchestrator across 10 cloud services with Doppler integration and coordinated rollback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "google-cloud-managedkafka>=0.1",
    "google-auth>=2.28",
    "google-api-python-client>=2.120",
    "firebase-admin>=6.4",
    "httpx>=0.27",
    "pymongo>=4.6",
    "psycopg2-binary>=2.9",
    "msal>=1.28",
    "azure-mgmt-cognitiveservices>=13.0",
    "azure-identity>=1.16",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resources"]

[project.scripts]
secrets-rot = "main:main"
